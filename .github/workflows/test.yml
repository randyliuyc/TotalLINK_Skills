name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # README 声明的最低版本 + 当前的稳定版本
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 零第三方依赖：只做语法检查 + 标准库 unittest
      - name: Compile all scripts
        run: python -m compileall -q scripts model-designer pdf-generator reimbursement-audit tests

      - name: Run regression tests
        run: python -m unittest discover -s tests -v
